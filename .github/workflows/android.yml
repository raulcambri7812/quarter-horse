name: Android APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --assetPath assets
      - name: Splash oscuro con el logo (Android 12+)
        run: |
          cp -r android-res/. android/app/src/main/res/
          python3 - <<'PY'
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          s=s.replace('<item name="android:background">@drawable/splash</item>','<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">#0c0c0c</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>')
          open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuarterHorse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK para descargarlo desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuarterHorse-prueba.apk
          gh release delete prueba --yes --cleanup-tag || true
          gh release create prueba QuarterHorse-prueba.apk --title "APK de prueba (Android)" --notes "Descarga QuarterHorse-prueba.apk en tu Android e instálalo. Es una versión de prueba."
